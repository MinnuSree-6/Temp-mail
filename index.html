<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>15 Minute Temp Mail</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Arial,sans-serif;background:#f0f8ff;color:#333;min-height:100vh;padding:20px}
.container{max-width:800px;margin:0 auto;text-align:center}
h1{color:#1a73e8;font-size:2em;margin:20px 0;font-weight:bold}
.timer-text{color:#555;font-size:1em;margin-bottom:10px}
.email-box{background:#ffffff;padding:25px;border-radius:15px;margin:20px 0;box-shadow:0 4px 15px rgba(26,115,232,0.2);border:2px solid #e3f2fd}
.email-address{font-size:1.2em;color:#1a73e8;background:#e3f2fd;padding:12px;border-radius:8px;margin:10px 0;font-weight:bold;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px}
.timer{font-size:1.5em;color:#555;margin:10px 0}
.buttons{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:15px}
.btn{background:#f5f5f5;color:#333;border:2px solid #ddd;padding:12px 20px;border-radius:8px;cursor:pointer;font-size:1em;display:flex;align-items:center;justify-content:center;gap:8px;transition:all 0.3s}
.btn:hover{background:#e3f2fd;border-color:#1a73e8;color:#1a73e8}
.inbox-header{background:#1a73e8;color:#fff;padding:12px 20px;border-radius:10px 10px 0 0;margin-top:20px;text-align:left;font-size:1.1em;font-weight:bold;display:flex;align-items:center;gap:10px}
.inbox-body{background:#ffffff;border:2px solid #e3f2fd;border-top:none;border-radius:0 0 10px 10px;padding:15px}
.email-item{background:#f8f9fa;padding:15px;border-radius:8px;margin:8px 0;text-align:left;cursor:pointer;border:1px solid #e3f2fd;display:flex;align-items:center;gap:10px}
.email-item-content{flex:1}
.email-item h3{color:#333;font-size:0.95em;margin-bottom:4px}
.email-item .from{color:#666;font-size:0.82em;display:flex;align-items:center;gap:5px}
.email-item .time{color:#999;font-size:0.8em;margin-top:4px;display:flex;align-items:center;gap:5px}
.email-body{background:#fff;padding:15px;border-radius:8px;margin-top:10px;display:none;font-size:0.9em;color:#333;border:1px solid #e3f2fd}
.arrow{color:#1a73e8;font-size:1.2em}
</style>
</head>
<body>
<div class="container">
<h1>⏱️ 15 Minute Temp Mail</h1>
<div class="email-box">
<p class="timer-text">⏰ Your e-mail address will expire in <span id="timer">15:00</span></p>
<div class="email-address" id="emailAddr" onclick="copyEmail()">
📋 Loading...
</div>
<div class="buttons">
<button class="btn" onclick="checkInbox()">🔄 Refresh</button>
<button class="btn" onclick="newEmail()">⭐ New</button>
<button class="btn" onclick="copyEmail()">📋 Copy Email</button>
<button class="btn" onclick="newEmail()">↩️ Recover</button>
</div>
</div>

<div class="inbox-header">📬 InBox</div>
<div class="inbox-body" id="inboxContent">
<div class="email-item">
<div class="email-item-content">
<h3>✉️ Hi, Welcome to 15 Minute Temp Mail</h3>
<p class="from">🌐 no-reply@15minutemail.com</p>
<p class="time">⏱️ just now</p>
</div>
<span class="arrow">›</span>
</div>
</div>
</div>

<script>
let timeLeft=900;
let timerInterval;
let currentEmail='';
let startTime=Date.now();

const domains=['sharklasers.com','guerrillamail.info','grr.la','guerrillamail.biz','guerrillamail.de','guerrillamail.net','guerrillamail.org'];

function randomName(){
const chars='abcdefghijklmnopqrstuvwxyz0123456789';
let result='';
for(let i=0;i<10;i++) result+=chars.charAt(Math.floor(Math.random()*chars.length));
return result;
}

function timeAgo(){
const seconds=Math.floor((Date.now()-startTime)/1000);
if(seconds<60) return seconds+' seconds ago';
if(seconds<3600) return Math.floor(seconds/60)+' minutes ago';
return Math.floor(seconds/3600)+' hours ago';
}

function generateEmail(){
const name=randomName();
const domain=domains[Math.floor(Math.random()*domains.length)];
currentEmail=name+'@'+domain;
document.getElementById('emailAddr').innerHTML='📋 '+currentEmail;
startTime=Date.now();
startTimer();
showWelcome();
}

function showWelcome(){
document.getElementById('inboxContent').innerHTML=`
<div class="email-item">
<div class="email-item-content">
<h3>✉️ Hi, Welcome to 15 Minute Temp Mail</h3>
<p class="from">🌐 no-reply@15minutemail.com</p>
<p class="time">⏱️ just now</p>
</div>
<span class="arrow">›</span>
</div>`;
}

async function checkInbox(){
try{
const name=currentEmail.split('@')[0];
const r=await fetch(`https://api.guerrillamail.com/ajax.php?f=get_email_address&email_user=${name}`,{credentials:'include'});
const d=await r.json();
const r2=await fetch(`https://api.guerrillamail.com/ajax.php?f=check_email&seq=0&sid_token=${d.sid_token}`,{credentials:'include'});
const d2=await r2.json();
let html=`<div class="email-item">
<div class="email-item-content">
<h3>✉️ Hi, Welcome to 15 Minute Temp Mail</h3>
<p class="from">🌐 no-reply@15minutemail.com</p>
<p class="time">⏱️ ${timeAgo()}</p>
</div>
<span class="arrow">›</span>
</div>`;
if(d2.list && d2.list.length>0){
d2.list.forEach(email=>{
const isOTP=email.mail_subject.toLowerCase().includes('otp')||
email.mail_subject.toLowerCase().includes('verif')||
email.mail_subject.toLowerCase().includes('code');
html+=`<div class="email-item" onclick="toggleBody(this)">
<div class="email-item-content">
<h3>${isOTP?'🔐':'✉️'} ${email.mail_subject}</h3>
<p class="from">🌐 ${email.mail_from}</p>
<p class="time">⏱️ ${timeAgo()}</p>
<div class="email-body">${email.mail_excerpt}</div>
</div>
<span class="arrow">›</span>
</div>`;
});
}
document.getElementById('inboxContent').innerHTML=html;
}catch(e){
console.log('error');
}
}

function toggleBody(el){
const body=el.querySelector('.email-body');
if(body) body.style.display=body.style.display==='block'?'none':'block';
}

function startTimer(){
clearInterval(timerInterval);
timeLeft=900;
timerInterval=setInterval(()=>{
timeLeft--;
let m=Math.floor(timeLeft/60);
let s=timeLeft%60;
document.getElementById('timer').textContent=m+':'+(s<10?'0':'')+s;
if(timeLeft<=0){clearInterval(timerInterval);newEmail();}
},1000);
}

function copyEmail(){
navigator.clipboard.writeText(currentEmail).then(()=>{
alert('Copied: '+currentEmail);
});
}

function newEmail(){
generateEmail();
}

generateEmail();
setInterval(checkInbox,20000);
setInterval(()=>{
const el=document.querySelector('.email-item .time');
if(el) el.textContent='⏱️ '+timeAgo();
},60000);
</script>
</body>
</html>
